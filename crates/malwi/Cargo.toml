[package]
name = "malwi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "An agentic malware scanner for source trees and software packages."
repository = "https://github.com/canvascomputing/malwi"
readme = "../../README.md"
keywords = ["malware", "security", "scanner", "agent", "llm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "malwi"
path = "src/main.rs"

[dependencies]
agentwerk = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
