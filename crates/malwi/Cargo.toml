[package]
name = "malwi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "An agentic malware scanner for source trees and software packages."
repository = "https://github.com/canvascomputing/malwi"
readme = "../../README.md"
keywords = ["malware", "security", "scanner", "agent", "llm"]
categories = ["command-line-utilities", "development-tools"]
# The synthetic sample tree runs a live beacon when imported: keep it out of
# the published crate so nothing ships a payload with the scanner.
exclude = ["tests/fixtures/**"]

[[bin]]
name = "malwi"
path = "src/main.rs"

[dependencies]
agentwerk = "0.1.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Features match agentwerk's own reqwest so the two unify into one build.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset", "system-proxy"] }
flate2 = "1"
# Without the default `xattr`: entries are written one at a time rather than
# unpacked wholesale, so extended attributes are never restored anyway.
tar = { version = "0.4", default-features = false }
# Decompression only, through the flate2 above: the default feature set adds
# aes-crypto, bzip2, zstd, lzma, xz, and ppmd for archives no registry serves.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "test-util"] }
